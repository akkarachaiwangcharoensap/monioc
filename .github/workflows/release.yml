name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  # ── macOS (.dmg) ─────────────────────────────────────────────────────────────
  macos:
    name: Build macOS
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target

      - name: Install npm dependencies
        run: npm ci

      - name: Install Python build dependencies
        run: pip install pandas

      - name: Build grocery database
        working-directory: app
        run: python3 scripts/build-grocery-db.py --force

      - name: Build app
        working-directory: app
        run: npx tauri build
        env:
          # Ad-hoc signing ("-") prevents macOS Gatekeeper from reporting the
          # app as "damaged" when downloaded.  Users will still see an
          # "unidentified developer" prompt the first time they open it;
          # they can bypass it with right-click → Open.
          APPLE_SIGNING_IDENTITY: "-"

      - name: Stage release asset
        run: cp app/src-tauri/target/release/bundle/dmg/*.dmg Monioc.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: Monioc.dmg

  # ── Windows (.exe) ───────────────────────────────────────────────────────────
  windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target

      - name: Install npm dependencies
        run: npm ci

      - name: Install Python build dependencies
        run: pip install pandas

      - name: Build grocery database
        working-directory: app
        run: python3 scripts/build-grocery-db.py --force

      # Bundle a self-contained Python 3.12 runtime with all AI dependencies
      # pre-installed.  This is what gets shipped inside the .exe installer so
      # users don't need Python on their system and the first launch doesn't
      # have to download anything.
      #
      # Layout produced: app/src-tauri/python-runtime/
      #   ├── python.exe                 (10 MB, embeddable)
      #   ├── python312.dll, *.zip, ...
      #   ├── python312._pth             (with `import site` enabled)
      #   └── Lib/site-packages/         (paddleocr, paddlepaddle, llama-cpp-python, ...)
      - name: Bundle Python runtime + AI dependencies
        shell: pwsh
        working-directory: app/src-tauri
        env:
          # Force pip to refuse source distributions for any package and use
          # only prebuilt wheels.  Saves ~20 minutes of from-source builds and
          # avoids needing Visual Studio + CMake on the runner.  Per-package
          # overrides below remain authoritative for llama-cpp-python.
          PIP_PREFER_BINARY: "1"
          # The bundled python.exe will be invoked by Tauri at runtime with
          # whatever encoding the user's locale defaults to.  Pinning UTF-8
          # here too keeps the install logs readable when paddlepaddle or
          # huggingface_hub print non-ASCII progress lines.
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"
          $PythonVersion = "3.12.7"
          $EmbedUrl = "https://www.python.org/ftp/python/$PythonVersion/python-$PythonVersion-embed-amd64.zip"

          Write-Host "Downloading Python $PythonVersion embeddable runtime..."
          Invoke-WebRequest -Uri $EmbedUrl -OutFile python-embed.zip -UseBasicParsing
          if (Test-Path python-runtime) { Remove-Item -Recurse -Force python-runtime }
          Expand-Archive -Path python-embed.zip -DestinationPath python-runtime -Force
          Remove-Item python-embed.zip

          # Embeddable Python ships with `import site` commented out — uncomment
          # so pip and our deps end up on sys.path.
          $pthFile = Get-ChildItem -Path python-runtime -Filter "python*._pth" |
              Select-Object -First 1
          $content = Get-Content $pthFile.FullName
          $content = $content -replace '^\s*#\s*import\s+site', 'import site'
          Set-Content -Path $pthFile.FullName -Value $content

          Write-Host "Bootstrapping pip..."
          Invoke-WebRequest -Uri "https://bootstrap.pypa.io/get-pip.py" `
              -OutFile get-pip.py -UseBasicParsing
          & .\python-runtime\python.exe get-pip.py --no-warn-script-location
          Remove-Item get-pip.py

          Write-Host "Installing AI dependencies (~500 MB)..."
          & .\python-runtime\python.exe -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { throw "pip upgrade failed (exit $LASTEXITCODE)" }

          # ── paddlepaddle: install from the *official* Paddle CDN ──────
          # PaddleOCR's installation guide (PaddlePaddle/PaddleOCR →
          # docs/installation.en.md) tells Windows users to install the
          # framework from https://www.paddlepaddle.org.cn/packages/stable/cpu/
          # rather than PyPI.  Same version number, different build:
          # only the CDN wheel is the one the PaddlePaddle team builds and
          # tests for Windows production deployment, and it includes the
          # paddle_inference DLLs that paddleocr needs to load.  The PyPI
          # mirror is a thin/legacy build that is missing pieces of the
          # inference runtime on Windows.
          # 3.1.x is the first series with full PP-OCRv5 Windows support.
          Write-Host "  Installing paddlepaddle from official Paddle CDN..."
          & .\python-runtime\python.exe -m pip install `
              --index-url https://www.paddlepaddle.org.cn/packages/stable/cpu/ `
              --extra-index-url https://pypi.org/simple `
              "paddlepaddle>=3.1.0,<3.2.0"
          if ($LASTEXITCODE -ne 0) { throw "paddlepaddle CDN install failed (exit $LASTEXITCODE)" }

          # ── onnxruntime backend for PaddleOCR HPI ────────────────────
          # Install onnxruntime + paddle2onnx ahead of paddleocr so that
          # PaddleOCR's HPI layer detects them on first instantiation and
          # converts the PP-OCRv5 weights to ONNX once instead of falling
          # back to paddle_inference (which crashes on Windows CPU per
          # the PIR coverage gap).  scan_receipt.py / check_models.py
          # then pass enable_hpi=True, hpi_config={"backend":"onnxruntime"}.
          Write-Host "  Installing onnxruntime + paddle2onnx (Windows HPI backend)..."
          & .\python-runtime\python.exe -m pip install `
              "onnxruntime>=1.18.0" "paddle2onnx>=1.2.0"
          if ($LASTEXITCODE -ne 0) { throw "onnxruntime install failed (exit $LASTEXITCODE)" }

          # ── llama-cpp-python: prebuilt CPU wheel from abetlen index ──
          # llama-cpp-python does NOT publish prebuilt wheels on PyPI; pip
          # falls back to a from-source build that needs scikit-build-core +
          # Visual Studio + CMake and fails on the runner with:
          #   BackendUnavailable: Cannot import 'scikit_build_core.build'
          # The project hosts CPU wheels on their own GitHub Pages index.
          # Two flags make pip actually use them:
          #   --extra-index-url <url>     adds the wheel index to the search
          #   --only-binary llama-cpp-python  refuses to fall back to sdist
          #                                   for this package even if pip
          #                                   thinks a newer sdist exists
          # Install it before -r requirements.txt so the subsequent pass
          # sees the version constraint as already satisfied.
          Write-Host "  Installing llama-cpp-python from prebuilt CPU wheel..."
          & .\python-runtime\python.exe -m pip install `
              --only-binary llama-cpp-python `
              --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu `
              "llama-cpp-python>=0.3.0"
          if ($LASTEXITCODE -ne 0) { throw "llama-cpp-python wheel install failed (exit $LASTEXITCODE)" }

          Write-Host "  Installing remaining dependencies from PyPI..."
          # Repeat --only-binary llama-cpp-python + its wheel index, and
          # add the Paddle CDN as an extra index, so that pip's resolver
          # doesn't silently downgrade/upgrade either of the three special
          # packages back to a broken default while resolving
          # requirements.txt.  Default index stays PyPI for everything else.
          & .\python-runtime\python.exe -m pip install `
              --only-binary llama-cpp-python `
              --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu `
              --extra-index-url https://www.paddlepaddle.org.cn/packages/stable/cpu/ `
              -r ../data/requirements.txt
          if ($LASTEXITCODE -ne 0) { throw "pip install failed (exit $LASTEXITCODE)" }

          # Smoke-import the runtime stack so a broken bundle fails the build
          # instead of shipping an installer that crashes on the user's
          # machine.  KMP_DUPLICATE_LIB_OK + FLAGS_enable_pir_* mirror the
          # runtime guards set at the top of scan_receipt.py /
          # check_models.py — without them the import below aborts the
          # runner with `OMP: Error #15` or PIR operator errors.
          Write-Host "Smoke-testing AI runtime imports..."
          $env:KMP_DUPLICATE_LIB_OK = "TRUE"
          $env:FLAGS_enable_pir_api = "0"
          $env:FLAGS_enable_pir_in_executor = "0"
          # Single-line `python -c` — a here-string would collide with YAML
          # block indentation.  The script imports every wheel we shipped,
          # prints the resolved versions, and asserts that onnxruntime
          # exposes the CPU execution provider (HPI refuses to start
          # otherwise).
          $smoke = "import paddle, paddleocr, llama_cpp, huggingface_hub, PIL, numpy, onnxruntime, paddle2onnx; " +
                   "print('paddle', paddle.__version__); " +
                   "print('paddleocr', paddleocr.__version__); " +
                   "print('onnxruntime', onnxruntime.__version__); " +
                   "print('paddle2onnx', paddle2onnx.__version__); " +
                   "print('numpy', numpy.__version__); " +
                   "providers = onnxruntime.get_available_providers(); " +
                   "assert 'CPUExecutionProvider' in providers, providers; " +
                   "print('onnxruntime EPs', providers)"
          & .\python-runtime\python.exe -c $smoke
          if ($LASTEXITCODE -ne 0) { throw "AI runtime smoke import failed (exit $LASTEXITCODE)" }

          # Pre-compile bytecode so __pycache__ exists alongside .py files —
          # otherwise Python tries to write to Program Files at runtime, which
          # fails silently and slows every import.  -q keeps logs tidy; -f
          # forces rebuild even if a stale .pyc exists.
          Write-Host "Pre-compiling Python bytecode..."
          & .\python-runtime\python.exe -m compileall -q -f .\python-runtime\Lib

          Write-Host "Bundle size:"
          $size = (Get-ChildItem -Recurse python-runtime |
              Measure-Object -Property Length -Sum).Sum
          "{0:N0} MB" -f ($size / 1MB)

      - name: Build app
        working-directory: app
        run: npx tauri build
        env:
          PYTHON: python3

      - name: Stage release asset
        shell: bash
        run: cp app/src-tauri/target/release/bundle/nsis/*.exe Monioc-setup.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: Monioc-setup.exe

  # ── Linux (.AppImage) ────────────────────────────────────────────────────────
  linux:
    name: Build Linux
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Install npm dependencies
        run: npm ci

      - name: Install Python build dependencies
        run: pip install pandas

      - name: Build grocery database
        working-directory: app
        run: python3 scripts/build-grocery-db.py --force

      - name: Build app
        working-directory: app
        run: npx tauri build

      - name: Stage release asset
        run: cp app/src-tauri/target/release/bundle/appimage/*.AppImage monioc.AppImage

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: monioc.AppImage

  # ── Publish GitHub release ───────────────────────────────────────────────────
  publish:
    name: Publish release
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            Monioc.dmg
            Monioc-setup.exe
            monioc.AppImage
